        const FadingVideo = ({ src, fallback }) => {
            const videoRef = useRef(null);
            const fadeRafRef = useRef(null);

            const FADE_MS = 500;
            const FADE_OUT_LEAD = 0.55;

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const fadeTo = (targetOpacity, duration) => {
                    if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                    const startOpacity = parseFloat(video.style.opacity || 0);
                    const startTime = performance.now();

                    const animate = (currentTime) => {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        // easeOut
                        const easedProgress = 1 - Math.pow(1 - progress, 2);
                        
                        video.style.opacity = startOpacity + (targetOpacity - startOpacity) * easedProgress;

                        if (progress < 1) {
                            fadeRafRef.current = requestAnimationFrame(animate);
                        }
                    };
                    fadeRafRef.current = requestAnimationFrame(animate);
                };

                const handleLoadedData = () => {
                    video.style.opacity = '0';
                    video.play().catch(e => console.warn("Video autoplay prevented:", e));
                    fadeTo(1, FADE_MS);
                };

                const handleTimeUpdate = () => {
                    if (video.duration - video.currentTime <= FADE_OUT_LEAD) {
                        fadeTo(0, FADE_MS);
                    }
                };

                const handleEnded = () => {
                    video.style.opacity = '0';
                    setTimeout(() => {
                        video.currentTime = 0;
                        video.play().catch(e => console.warn("Video replay prevented:", e));
                        fadeTo(1, FADE_MS);
                    }, 100);
                };

                video.addEventListener('loadeddata', handleLoadedData);
                video.addEventListener('timeupdate', handleTimeUpdate);
                video.addEventListener('ended', handleEnded);

                return () => {
                    video.removeEventListener('loadeddata', handleLoadedData);
                    video.removeEventListener('timeupdate', handleTimeUpdate);
                    video.removeEventListener('ended', handleEnded);
                    if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                };
            }, []);

            return (
                <div className="absolute inset-0 w-full h-full z-0 overflow-hidden bg-black">
                    {fallback && <img src={fallback} alt="" className="absolute inset-0 w-full h-full object-cover opacity-30" />}
                    <video
                        ref={videoRef}
                        src={src}
                        className="absolute inset-0 w-full h-full object-cover mix-blend-screen"
                        style={{ opacity: 0 }}
                        autoPlay
                        muted
                        playsInline
                        preload="auto"
                    />
                    {/* Gradient overlay to ensure text contrast */}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
                </div>
            );
        };

                        <div className="relative z-10 max-w-3xl mx-auto w-full">
