        const FadingVideo = ({ src, className, style }) => {
            const videoRef = useRef(null);
            const fadeRafRef = useRef(null);
            const fadingOutRef = useRef(false);

            const FADE_MS = 500;
            const FADE_OUT_LEAD = 0.55;

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const fadeTo = (targetOpacity, duration) => {
                    if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                    const startOpacity = parseFloat(video.style.opacity || 0);
                    const startTime = performance.now();

                    const animate = (currentTime) => {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        video.style.opacity = startOpacity + (targetOpacity - startOpacity) * progress;

                        if (progress < 1) {
                            fadeRafRef.current = requestAnimationFrame(animate);
                        }
                    };
                    fadeRafRef.current = requestAnimationFrame(animate);
                };

                const handleLoadedData = () => {
                    video.style.opacity = '0';
                    video.play().catch(e => console.warn("Autoplay prevented:", e));
                    fadeTo(1, FADE_MS);
                };

                const handleTimeUpdate = () => {
                    if (!fadingOutRef.current && video.duration > 0 && (video.duration - video.currentTime) <= FADE_OUT_LEAD) {
                        fadingOutRef.current = true;
                        fadeTo(0, FADE_MS);
                    }
                };

                const handleEnded = () => {
                    video.style.opacity = '0';
                    setTimeout(() => {
                        video.currentTime = 0;
                        video.play().catch(e => console.warn("Replay prevented:", e));
                        fadingOutRef.current = false;
                        fadeTo(1, FADE_MS);
                    }, 100);
                };

                video.addEventListener('loadeddata', handleLoadedData);
                video.addEventListener('timeupdate', handleTimeUpdate);
                video.addEventListener('ended', handleEnded);

                return () => {
                    video.removeEventListener('loadeddata', handleLoadedData);
                    video.removeEventListener('timeupdate', handleTimeUpdate);
                    video.removeEventListener('ended', handleEnded);
                    if (fadeRafRef.current) cancelAnimationFrame(fadeRafRef.current);
                };
            }, []);

                    ref={videoRef}
                    src={src}
                    className={className}
                    style={{ ...style, opacity: 0 }}
                    autoPlay
                    muted
                    playsInline
                    preload="auto"
                />
            );
        };
